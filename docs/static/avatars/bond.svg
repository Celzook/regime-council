<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="BOND">
  <defs>
    <clipPath id="orb"><circle cx="48" cy="48" r="47"/></clipPath>
    <filter id="mesh" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="11"/></filter>
    <radialGradient id="spec" cx="32%" cy="20%" r="58%">
      <stop offset="0" stop-color="#fff" stop-opacity=".72"/>
      <stop offset=".42" stop-color="#fff" stop-opacity=".1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shade" cx="50%" cy="46%" r="54%">
      <stop offset=".7" stop-color="#001a66" stop-opacity="0"/>
      <stop offset="1" stop-color="#001a66" stop-opacity=".32"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".12"/>
    </linearGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.6" stdDeviation="1.8" flood-color="#00145a" flood-opacity=".38"/>
    </filter>
  </defs>
  <g clip-path="url(#orb)">
    <rect width="96" height="96" fill="#2c66ff"/>
    <g filter="url(#mesh)">
      <circle cx="16" cy="18" r="34" fill="#5fd3ff"/>
      <circle cx="86" cy="24" r="30" fill="#3a7dff"/>
      <circle cx="76" cy="88" r="38" fill="#1d47e6"/>
      <circle cx="12" cy="86" r="26" fill="#1f9bff"/>
    </g>
    <circle cx="48" cy="48" r="47" fill="url(#shade)"/>
    <circle cx="48" cy="48" r="47" fill="url(#spec)"/>
  </g>
  <circle cx="48" cy="48" r="46.4" fill="none" stroke="url(#rim)" stroke-width="1.2"/>
  <!-- 글리프: 수익률 곡선 -->
  <g filter="url(#lift)">
    <path d="M27 63 C35 47 45 40 69 35" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <circle cx="27" cy="63" r="4.4" fill="#fff"/>
    <circle cx="42" cy="44.9" r="4.4" fill="#fff"/>
    <circle cx="69" cy="35" r="4.4" fill="#fff"/>
  </g>
</svg>
